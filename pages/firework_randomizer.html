/* ---------- hidden debug ---------- */
function fmt(v) {
  if (typeof v === 'number') return +v.toFixed(3);
  if (Array.isArray(v)) return v.map(x => typeof x === 'number' ? +x.toFixed(2) : x).join(', ');
  return v;
}
function dumpGroup(title, obj) {
  let out = '<b>' + title + '</b>\n';
  for (const k in obj) {
    const v = obj[k];
    if (v === null || v === undefined) continue;
    if (typeof v === 'object' && !Array.isArray(v)) { out += '  ' + k + ': {' + Object.keys(v).map(q => q + ':' + fmt(v[q])).join(' ') + '}\n'; }
    else out += '  ' + k.padEnd(14) + ' ' + fmt(v) + '\n';
  }
  return out;
}
let fpsEMA = 60;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
function renderDebug() {
  if (!state.P) { debugEl.textContent = 'no firework yet'; return; }
  const P = state.P;
  let t = '<b>FIREWORK DEBUG</b>  [D] close\n';
  t += 'seed: ' + esc(state.seedText) + '\ntier: ' + TIER_NAME + '  pool ' + POOL_MAX.toLocaleString() + '\n';
  t += 'sparks: ' + state.sparkCount.toLocaleString() + '  smoke: ' + state.smokeCount + '  flares: ' + state.flareCount + (state.P && state.P.shell.hasFlares ? '' : ' (none)') + '\n';
  t += 'active shots: ' + state.shots.length + '  pool used: ' + state.sparkHigh.toLocaleString() + '/' + (cfg.maxOverall | 0).toLocaleString() + '\n';
  t += 'hidden params: ' + state.paramCount + '\n';
  t += 'fps: ' + fpsEMA.toFixed(0) + '  pixelRatio: ' + renderer.getPixelRatio().toFixed(2) + '\n';
  t += 'keys: B bloom  T trails  S smoke  G slow-mo  R replay\n\n';
  t += dumpGroup('SHELL', P.shell) + '\n';
  P.stages.forEach((s, i) => { t += dumpGroup('STAGE ' + (i + 1) + ' - ' + s.type, s) + '\n'; });
  t += dumpGroup('SMOKE', P.smoke) + '\n' + dumpGroup('AUDIO', P.audio) + '\n' + dumpGroup('POST', P.post);
  debugEl.innerHTML = t;
}
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); fireFromBox({ randomLoc: true }); return; } // spacebar detonates
  const k = e.key.toLowerCase();
  if (k === 'd') { state.debugOn = !state.debugOn; debugEl.classList.toggle('show', state.debugOn); if (state.debugOn) renderDebug(); }
  else if (k === 'b') { setToggle('bloomOn', cfg.bloomOn ? 0 : 1); }
  else if (k === 't') { setToggle('trailsOn', cfg.trailsOn ? 0 : 1); }
  else if (k === 's') { setToggle('smokeOn', cfg.smokeOn ? 0 : 1); }
  else if (k === 'g') { state.timeScale = state.timeScale === 1 ? .22 : 1; }
  else if (k === 'r') { if (state.seedText) detonate(state.seedText, { addHistory: false }); }
  else if (k === 'a') { autoBtn.click(); }   // toggle Auto Play start/stop
  else if (k === 'f') { toggleFullscreen(); }
});

/* =====================================================================
   FRAME LOOP
===================================================================== */
const clock = new THREE.Clock();
let adaptTimer = 0;
let targetPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(targetPR);
  renderer.setSize(w, h);
  composer.setPixelRatio(targetPR);
  composer.setSize(w, h);
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  persistA.setSize(db.x, db.y);
  persistB.setSize(db.x, db.y);
  const ps = db.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  state.basePS = ps;
  sparkUni.uPointScale.value = ps * cfg.pointSize;
  smokeUni.uPointScale.value = ps;
  cursorMat.uniforms.uPointScale.value = ps;
  flareUni.uPointScale.value = ps * cfg.flareSize;
  sparkUni.uMaxPoint.value = Math.min(90 * targetPR, 160);
  cursorMat.uniforms.uMaxPoint.value = Math.min(120 * targetPR, 200);
  flareUni.uMaxPoint.value = Math.min(180 * targetPR, 300);
  scene.userData.starMat.uniforms.uPr.value = targetPR;
}
window.addEventListener('resize', resize);
resize();

function updateLights(t) {
  let lift = 0;
  const act = state.shots.slice(-4);
  for (let i = 0; i < 4; i++) {
    const pr = smokeUni.uLPosRad.value[i], pc = smokeUni.uLCol.value[i];
    if (i >= act.length) { pr.w = 0; pc.setRGB(0, 0, 0); continue; }
    const shot = act[i], P = shot.P, lt0 = t - shot.t0;
    const flashEnv = lt0 >= 0 ? P.shell.flashIntensity * Math.exp(-lt0 / P.shell.flashTau) : 0;
    let r = flashEnv * .03, g = flashEnv * .028, b = flashEnv * .025;
    for (const st of P.stages) {
      const lt = lt0 - st.delay;
      if (lt < 0 || lt > st.life) continue;
      const u = lt / st.life;
      const env = Math.pow(1 - u, st.fadePow) * st.brightness * .028;
      r += st.col.rgb[0] * env; g += st.col.rgb[1] * env; b += st.col.rgb[2] * env;
    }
    const m = Math.max(r, g, b);
    if (m > .6) { const s = .6 / m; r *= s; g *= s; b *= s; }
    const o = P.shell.origin;
    pr.set(o[0], o[1], o[2], 14 + 120 * P.shell.caliber);
    pc.setRGB(r, g, b);
    lift += flashEnv * P.shell.skyLift + Math.max(r, g, b) * .004;
  }
  skyUni.uLift.value = Math.min(.12, lift);
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .25); // clamp only tab-switch jumps; slow GPUs keep real pacing
  const wall = performance.now() / 1000;
  fpsEMA += ((1 / Math.max(dt, 1e-4)) - fpsEMA) * .04;

  /* adaptive pixel ratio */
  adaptTimer += dt;
  if (adaptTimer > 1.6) {
    adaptTimer = 0;
    const base = Math.min(window.devicePixelRatio || 1, 2);
    if (fpsEMA < 46 && targetPR > .62) { targetPR = Math.max(.6, targetPR * .85); resize(); }
    else if (fpsEMA > 57 && targetPR < base) { targetPR = Math.min(base, targetPR * 1.12); resize(); }
  }

  state.simT += dt * state.timeScale;  // global clock: every shot keeps its own t0
  const t = state.simT;
  sparkUni.uTime.value = t;
  smokeUni.uTime.value = t;
  flareUni.uTime.value = t;
  for (const m of flashPool) m.material.uniforms.uTime.value = t;
  for (const m of shockPool) m.material.uniforms.uTime.value = t;
  scene.userData.starMat.uniforms.uT.value = wall;
  state.shots = state.shots.filter(s => t < s.end + 10);
  updateLights(t);

  /* live settings applied every frame (cheap, no re-detonate needed) */
  renderer.toneMappingExposure = state.baseExposure * cfg.exposure;
  sparkUni.uPointScale.value = state.basePS * cfg.pointSize;
  flareUni.uPointScale.value = state.basePS * cfg.flareSize;
  flareUni.uBright.value = cfg.flareBright;
  flareUni.uSpike.value = cfg.flareSpikes;
  compositePass.material.uniforms.uTrailsOn.value = state.trailsOn ? 1 : 0;
  emitCursor(dt, wall);
  if (state.autoPlay) autoTick(wall);

  /* persistence ping-pong: A=write B=read */
  fadeQuad.material.uniforms.tPrev.value = persistB.texture;
  let damp = 0;
  if (state.trailsOn) {
    damp = cfg.trailFloor; // graceful fade floor for residual trails between shots (settings-tunable)
    for (const s of state.shots) damp = Math.max(damp, s.P.post.trailDamp);
  }
  fadeQuad.material.uniforms.uDamp.value = damp > 0 ? Math.pow(damp, dt * 60) : 0;
  renderer.setRenderTarget(persistA);
  fadeQuad.render(renderer);
  renderer.autoClear = false;
  renderer.render(fxScene, camera);
  renderer.autoClear = true;
  renderer.setRenderTarget(null);

  compositePass.material.uniforms.tTrails.value = persistA.texture;
  composer.render();

  const tmp = persistA; persistA = persistB; persistB = tmp;
}
frame();

/* =====================================================================
   POINTER -> WORLD + LOCATION-BASED DETONATION
===================================================================== */
const _ndc = new THREE.Vector3();
function screenToWorld(clientX, clientY, out) {
  out = out || new THREE.Vector3();
  const nx = (clientX / window.innerWidth) * 2 - 1;
  const ny = -(clientY / window.innerHeight) * 2 + 1;
  _ndc.set(nx, ny, 0.5).unproject(camera).sub(camera.position).normalize();
  const t = -camera.position.z / _ndc.z;     // intersect the z = 0 plane
  return out.copy(camera.position).addScaledVector(_ndc, t);
}
function randomOrigin() {
  /* pick a safe on-screen NDC box (biased upward -- sparks fall), vary depth along the ray */
  const nx = Math.random() * 1.5 - 0.75;      // -0.75 .. 0.75
  const ny = Math.random() * 1.25 - 0.35;     // -0.35 .. 0.90 (upper half favoured)
  _ndc.set(nx, ny, 0.5).unproject(camera).sub(camera.position).normalize();
  const t = (-camera.position.z / _ndc.z) * (0.8 + Math.random() * 0.5);
  const p = camera.position.clone().addScaledVector(_ndc, t);
  return [p.x, p.y, p.z];
}

function onUI(t) {
  return !!(t && t.closest && (t.closest('#panel') || t.closest('#deck') || t.closest('#topbtns') || t.closest('#debug')));
}

/* ---- pointer motion -> world velocity: a click's flick gives the shell momentum ----
   Track the pointer's velocity on the z=0 plane (same plane a click detonates on), so
   flicking as you click makes the burst lean + drift that way, as if the shell were still
   moving when it broke. The drift is added to every spark's birth velocity, so it decays
   under the same air drag -- physically it is just the shell's velocity at break. */
const LAUNCH_SCALE = 0.1, LAUNCH_MAX = 150;   // world-units/s per world-units/s, capped
const _pw = new THREE.Vector3();
function trackPointerVel(cx, cy) {
  const now = performance.now();
  const w = screenToWorld(cx, cy, _pw);
  const dt = (now - pointer.lastT) / 1000;
  pointer.lastT = now;
  if (pointer.wSet && dt > 0 && dt < 0.12) {
    const a = 0.4;   // EMA smooths jitter but stays responsive to a flick
    pointer.vx += ((w.x - pointer.wx) / dt - pointer.vx) * a;
    pointer.vy += ((w.y - pointer.wy) / dt - pointer.vy) * a;
    pointer.vz += ((w.z - pointer.wz) / dt - pointer.vz) * a;
  }
  pointer.wx = w.x; pointer.wy = w.y; pointer.wz = w.z; pointer.wSet = true;
  pointer.lastMoveWall = now / 1000;
}
function pointerLaunchVel() {
  const age = performance.now() / 1000 - pointer.lastMoveWall;
  const fade = Math.max(0, 1 - age / 0.12);   // a settled cursor detonates with ~no drift
  const s = LAUNCH_SCALE * cfg.launchSens * fade;
  let lx = pointer.vx * s, ly = pointer.vy * s, lz = pointer.vz * s;
  const mag = Math.hypot(lx, ly, lz);
  if (mag > LAUNCH_MAX) { const k = LAUNCH_MAX / mag; lx *= k; ly *= k; lz *= k; }
  return [lx, ly, lz];
}

window.addEventListener('pointermove', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
  trackPointerVel(e.clientX, e.clientY);
});
window.addEventListener('pointerdown', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
  if (e.button !== 0 || onUI(e.target)) return;   // UI clicks never detonate
  fireFromBox({ at: { x: e.clientX, y: e.clientY }, launchVel: pointerLaunchVel() });   // click detonates where you clicked, leaning with your motion
});

/* =====================================================================
   FULLSCREEN CINEMA MODE
===================================================================== */
function toggleFullscreen() {
  const el = document.documentElement;
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
  }
}
function onFsChange() {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.body.classList.toggle('cinema', on);
  if (on) {
    capEl.textContent = 'CINEMA MODE  //  CLICK ANYWHERE TO DETONATE  //  ESC OR F TO EXIT';
    capEl.classList.add('show');
    clearTimeout(captionTimer);
    captionTimer = setTimeout(() => capEl.classList.remove('show'), 4600);
  }
}
document.getElementById('fs').addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);

/* =====================================================================
   AUTO PLAY -- a self-running show. Tempo breathes (starts slow, speeds
   up and eases off); mostly single random bursts with occasional
   clusters and angled line-sweeps. Uses the current settings; the pool
   caps handle overlap so it never runs away.
===================================================================== */
const autoBtn = document.getElementById('autoplay');
const aRand = (a, b) => a + (b - a) * Math.random();
function autoPlan(wall) {
  const W = window.innerWidth, Hh = window.innerHeight, roll = Math.random();
  if (roll < 0.16) {                       // cluster near one point
    const cx = aRand(0.2, 0.8) * W, cy = aRand(0.14, 0.55) * Hh, n = 3 + (Math.random() * 4 | 0);
    let t = wall;
    for (let i = 0; i < n; i++) { t += aRand(0.22, 0.4); state.autoQueue.push({ t, x: cx + aRand(-95, 95), y: cy + aRand(-70, 70) }); }
  } else if (roll < 0.28) {                 // angled line sweep across the sky
    const n = 4 + (Math.random() * 4 | 0), ang = aRand(-0.6, 0.6);
    const x0 = aRand(0.12, 0.32) * W, y0 = aRand(0.2, 0.55) * Hh, len = aRand(0.42, 0.62) * W;
    let t = wall;
    for (let i = 0; i < n; i++) { const f = n > 1 ? i / (n - 1) : 0; t += aRand(0.2, 0.32); state.autoQueue.push({ t, x: x0 + Math.cos(ang) * len * f, y: y0 - Math.sin(ang) * len * f }); }
  } else {                                  // single burst at a random visible spot
    state.autoQueue.push({ t: wall, x: null, y: null });
  }
}
function autoGap(wall) {
  const el = wall - state.autoStart;
  const warm = Math.min(1, el / 6);                  // ease in slowly for the first ~6s
  const breathe = 0.5 + 0.5 * Math.sin(el * 0.32);   // ~20s slow/fast breathing cycle
  const fastness = warm * (0.3 + 0.7 * (1 - breathe));
  return Math.max(0.42, (2.5 - 2.0 * fastness) * aRand(0.75, 1.3)); // ~2.5s slow .. ~0.5s fast
}
function autoTick(wall) {
  while (state.autoQueue.length && state.autoQueue[0].t <= wall) {
    const s = state.autoQueue.shift();
    if (wall - s.t > 1.5) continue;                  // drop stale shots (tab was backgrounded)
    /* addHistory so the show's seeds roll through the list and can be copied */
    if (s.x == null) detonate(makeRandomSeed(), { randomLoc: true });
    else detonate(makeRandomSeed(), { at: { x: s.x, y: s.y } });
  }
  if (state.autoQueue.length === 0 && wall >= state.autoNext) {
    autoPlan(wall);
    const lastT = state.autoQueue.length ? state.autoQueue[state.autoQueue.length - 1].t : wall;
    state.autoNext = lastT + autoGap(wall);
  }
}
autoBtn.addEventListener('click', () => {
  state.autoPlay = !state.autoPlay;
  autoBtn.classList.toggle('on', state.autoPlay);
  autoBtn.textContent = state.autoPlay ? 'Stop Auto' : 'Auto Play';
  if (state.autoPlay) {
    const wall = performance.now() / 1000;
    state.autoStart = wall; state.autoNext = wall + 0.6; state.autoQueue.length = 0;
    ensureAudio();
  }
});

/* =====================================================================
   SETTINGS PANEL  ([key, label, min, max, step, suffix])
===================================================================== */
const PANEL_SECTIONS = [
  ['Particles', [
    ['density', 'Particle Density', 0.1, 2, 0.05, 'x'],
    ['maxParticles', 'Max Particles (per)', 100, 100000, 100, ''],
    ['maxOverall', 'Max Particles (overall)', 10000, POOL_MAX, 10000, ''],
    ['sizeMul', 'Spark Size', 0.3, 3, 0.05, 'x'],
    ['brightMul', 'Spark Brightness', 0.3, 3, 0.05, 'x'],
    ['lifeMul', 'Spark Lifetime', 0.4, 2.5, 0.05, 'x'],
  ]],
  ['Physics & Shape', [
    ['speedMul', 'Burst Speed', 0.4, 2, 0.05, 'x'],
    ['gravityMul', 'Gravity', 0.2, 2.5, 0.05, 'x'],
    ['dragMul', 'Air Drag', 0.4, 2.5, 0.05, 'x'],
    ['windMul', 'Wind', 0, 3, 0.05, 'x'],
    ['launchSens', 'Motion Reaction', 0, 3, 0.05, 'x'],
    ['calMin', 'Min Shell Size', 0, 1, 0.02, ''],
    ['calMax', 'Max Shell Size', 0, 1, 0.02, ''],
    ['maxStages', 'Max Stages', 1, 5, 1, ''],
  ]],
  ['Graphics', [
    ['bloom', 'Bloom Strength', 0, 1.5, 0.02, ''],
    ['bloomRadius', 'Bloom Radius', 0, 1, 0.02, ''],
    ['bloomThresh', 'Bloom Threshold', 0, 1, 0.02, ''],
    ['exposure', 'Exposure', 0.4, 2, 0.02, 'x'],
    ['trailFloor', 'Trail Persistence', 0, 0.96, 0.01, ''],
    ['hdrCeil', 'HDR Ceiling', 2, 40, 1, ''],
    ['vignette', 'Vignette', 0, 0.6, 0.02, ''],
    ['flashMul', 'Flash Intensity', 0, 3, 0.05, 'x'],
    ['pointSize', 'Point Scale', 0.4, 2.5, 0.05, 'x'],
  ]],
  ['Smoke & Sky', [
    ['smokeDensity', 'Smoke Density', 0, 2.5, 0.05, 'x'],
    ['smokeOpacity', 'Smoke Opacity', 0, 3, 0.05, 'x'],
    ['starBright', 'Star Brightness', 0, 2.5, 0.05, 'x'],
    ['skyGlow', 'Sky Glow', 0, 3, 0.05, 'x'],
  ]],
  ['Glowing Flares', [
    ['flareBright', 'Flare Glow', 0, 3, 0.05, 'x'],
    ['flareSize', 'Flare Size', 0.3, 3, 0.05, 'x'],
    ['flareSpikes', 'Spike Intensity', 0, 2, 0.05, 'x'],
  ]],
  ['Sound', [
    ['volume', 'Master Volume', 0, 1, 0.02, ''],
    ['boomMul', 'Boom', 0, 2.5, 0.05, 'x'],
    ['crackleMul', 'Crackle', 0, 2.5, 0.05, 'x'],
    ['hissMul', 'Hiss', 0, 2.5, 0.05, 'x'],
  ]],
  ['Sparkler Cursor', [
    ['cursorRate', 'Spark Rate', 0, 200, 5, ''],
    ['cursorSize', 'Spark Size', 0.3, 4, 0.1, ''],
    ['cursorTrail', 'Trail Length', 0.1, 1.2, 0.02, 's'],
    ['cursorSpread', 'Spread', 2, 40, 1, ''],
    ['cursorBright', 'Brightness', 0.2, 3, 0.05, 'x'],
    ['cursorCenter', 'Center Size', 0.5, 4, 0.1, ''],
  ]],
];
const PANEL_TOGGLES = [
  ['bloomOn', 'Bloom'], ['trailsOn', 'Trails'], ['smokeOn', 'Smoke'],
  ['flaresOn', 'Glowing Flares'], ['cursorOn', 'Sparkler Cursor'], ['soundDelay', 'Realistic Sound Delay'],
];
const ALLSLIDERS = {};
PANEL_SECTIONS.forEach(([, items]) => items.forEach(it => { ALLSLIDERS[it[0]] = it; }));

function fmtVal(key, v) {
  const d = ALLSLIDERS[key]; if (!d) return v;
  const suf = d[5];
  if (d[4] >= 1) return (v | 0).toLocaleString() + (suf ? ' ' + suf : '');
  return v.toFixed(2) + (suf === 'x' ? 'x' : suf ? ' ' + suf : '');
}

const panelEl = document.getElementById('panel');
const panelBody = document.getElementById('panel-body');
const sliderEls = {};

function buildPanel() {
  let html = '';
  for (const [title, items] of PANEL_SECTIONS) {
    html += '<div class="psec"><div class="ptitle">' + title + '</div>';
    for (const it of items) {
      html += '<div class="srow"><div class="slab"><span>' + it[1] + '</span><span class="sval" id="sv-' + it[0] + '"></span></div>'
        + '<input type="range" id="sl-' + it[0] + '" min="' + it[2] + '" max="' + it[3] + '" step="' + it[4] + '"></div>';
    }
    html += '</div>';
  }
  html += '<div class="psec"><div class="ptitle">Toggles</div>';
  for (const [key, label] of PANEL_TOGGLES) {
    html += '<label class="crow"><input type="checkbox" id="ck-' + key + '"><span>' + label + '</span></label>';
  }
  html += '</div><div class="psec"><div class="ptitle">Actions</div>'
    + '<button class="pbtn" id="btn-defaults">Restore Defaults</button>'
    + '<button class="pbtn" id="btn-fire">Detonate Random</button></div>';
  panelBody.innerHTML = html;

  for (const key in ALLSLIDERS) {
    const inp = document.getElementById('sl-' + key);
    sliderEls[key] = inp;
    inp.addEventListener('input', () => {
      cfg[key] = parseFloat(inp.value);
      document.getElementById('sv-' + key).textContent = fmtVal(key, cfg[key]);
      apply(key);
    });
  }
  for (const [key] of PANEL_TOGGLES) {
    document.getElementById('ck-' + key).addEventListener('change', function () { setToggle(key, this.checked ? 1 : 0); });
  }
  document.getElementById('btn-defaults').addEventListener('click', applyDefaults);
  document.getElementById('btn-fire').addEventListener('click', () => fireFromBox({ randomLoc: true }));
  syncPanel();
}
function syncPanel() {
  for (const key in ALLSLIDERS) {
    const inp = sliderEls[key]; if (!inp) continue;
    inp.value = cfg[key];
    document.getElementById('sv-' + key).textContent = fmtVal(key, cfg[key]);
  }
  for (const [key] of PANEL_TOGGLES) { const ck = document.getElementById('ck-' + key); if (ck) ck.checked = !!cfg[key]; }
}

function applyBloom() {
  bloomPass.strength = cfg.bloomOn ? cfg.bloom : 0;
  bloomPass.radius = cfg.bloomRadius;
  bloomPass.threshold = cfg.bloomThresh;
}
function apply(key) {
  switch (key) {
    case 'maxOverall': {   // shrinking the live pool: pull the draw range in so stale slots aren't drawn
      const c = Math.min(POOL_MAX, cfg.maxOverall | 0);
      if (state.sparkCursor >= c) { state.sparkCursor = 0; state.sparkWrapped = true; }
      state.sparkHigh = Math.min(state.sparkHigh, c);
      sparkGeo.setDrawRange(0, state.sparkHigh);
      break;
    }
    case 'bloom': case 'bloomRadius': case 'bloomThresh': applyBloom(); break;
    case 'hdrCeil': compositePass.material.uniforms.uCeilK.value = 1 / Math.max(1, cfg.hdrCeil); break;
    case 'vignette': compositePass.material.uniforms.uVig.value = cfg.vignette; break;
    case 'smokeOpacity': smokeUni.uAlphaMul.value = cfg.smokeOpacity; break;
    case 'starBright': scene.userData.starMat.uniforms.uBright.value = cfg.starBright; break;
    case 'skyGlow': skyUni.uBright.value = cfg.skyGlow; break;
    case 'volume': if (masterGain) masterGain.gain.value = muted ? 0 : cfg.volume; break;
  }
}
function setToggle(key, val) {
  cfg[key] = val ? 1 : 0;
  if (key === 'bloomOn') { state.bloomOn = !!val; applyBloom(); }
  else if (key === 'trailsOn') { state.trailsOn = !!val; }
  else if (key === 'smokeOn') { state.smokeOn = !!val; smokeGeo.setDrawRange(0, state.smokeOn ? state.smokeHigh : 0); }
  else if (key === 'flaresOn') { state.flaresOn = !!val; flareGeo.setDrawRange(0, state.flaresOn ? state.flareHigh : 0); }
  else if (key === 'cursorOn') { document.body.classList.toggle('no-cursor', !!val); if (!val) cursorPts.visible = false; }
  const ck = document.getElementById('ck-' + key); if (ck) ck.checked = !!val;
}
function applyAll() {
  applyBloom();
  compositePass.material.uniforms.uCeilK.value = 1 / Math.max(1, cfg.hdrCeil);
  compositePass.material.uniforms.uVig.value = cfg.vignette;
  smokeUni.uAlphaMul.value = cfg.smokeOpacity;
  scene.userData.starMat.uniforms.uBright.value = cfg.starBright;
  skyUni.uBright.value = cfg.skyGlow;
  if (masterGain) masterGain.gain.value = muted ? 0 : cfg.volume;
  state.bloomOn = !!cfg.bloomOn;
  state.trailsOn = !!cfg.trailsOn;
  state.smokeOn = !!cfg.smokeOn;
  smokeGeo.setDrawRange(0, state.smokeOn ? state.smokeHigh : 0);
  state.flaresOn = !!cfg.flaresOn;
  flareGeo.setDrawRange(0, state.flaresOn ? state.flareHigh : 0);
  document.body.classList.toggle('no-cursor', !!cfg.cursorOn);
}
function applyDefaults() {
  Object.assign(cfg, CFG_DEFAULTS);
  syncPanel();
  applyAll();
}

document.getElementById('panel-tab').addEventListener('click', () => {
  const collapsed = panelEl.classList.toggle('collapsed');
  document.body.classList.toggle('panel-open', !collapsed);
});

/* 5 persisted save slots (empty=save, filled=load, x=clear->defaults) */
function initPresets() {
  const KEY = 'fw_presets_v1', N = 5;
  const slotEls = Array.from(document.querySelectorAll('#slots .slot'));
  let slots;
  try { slots = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!Array.isArray(slots) || slots.length !== N) slots = [null, null, null, null, null];
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(slots)); } catch (e) {} };
  function render() {
    slotEls.forEach((el, i) => {
      el.classList.toggle('filled', !!slots[i]);
      el.title = slots[i]
        ? 'Slot ' + (i + 1) + ' saved - click to load. Click x to clear (reverts to defaults).'
        : 'Slot ' + (i + 1) + ' empty - click to save all current settings.';
    });
  }
  slotEls.forEach(el => el.addEventListener('click', e => {
    const i = +el.dataset.slot;
    if (e.target.closest('.sx')) {
      e.preventDefault(); e.stopPropagation();
      if (!slots[i]) return;
      slots[i] = null; persist(); render(); applyDefaults();
      return;
    }
    if (slots[i]) { Object.assign(cfg, CFG_DEFAULTS, slots[i]); syncPanel(); applyAll(); }
    else { slots[i] = Object.assign({}, cfg); persist(); render(); }
  }));
  render();
}

buildPanel();
initPresets();
applyAll();

/* welcome shot (silent -- audio unlocks on first gesture) */
setTimeout(() => { if (!state.P) detonate(makeRandomSeed(), { audio: false }); }, 650);

/* hidden debug handle: sim time is analytic, so jumping state.simT is exact */
window.__fw = {
  state, detonate, cfg,
  fx: { sparks, flares, smoke },   // debug: toggle .visible to isolate a layer
  cursor: { get high() { return cursorHigh; }, get active() { return pointer.active; }, get visible() { return cursorPts.visible; } },
};

/* context-loss guard */
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  capEl.textContent = 'GRAPHICS CONTEXT LOST -- RELOAD THE PAGE';
  capEl.classList.add('show');
});
