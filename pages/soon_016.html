<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unidentified &mdash; Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03070a;
    --panel-bg: rgba(5, 12, 14, 0.93);
    --border: rgba(61, 255, 176, 0.16);
    --accent: #3dffb0;
    --accent2: #ff4d6d;
    --text: #c4d8d2;
    --text-dim: #4f6a66;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { background: var(--bg); }
  body {
    background: radial-gradient(ellipse at 50% 50%, rgba(61,255,176,0.05) 0%, var(--bg) 66%);
    color: var(--text); font-family: var(--sans); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  /* -- Backdrop -- */
  #scope { position: fixed; inset: 0; z-index: 0; }

  /* -- Card -- */
  .card {
    position: relative; z-index: 2; width: min(640px, 90vw);
    background: var(--panel-bg); border: 1px solid var(--border); border-top: 2px solid var(--accent);
    box-shadow: 0 0 90px rgba(61,255,176,0.10); backdrop-filter: blur(4px);
    padding: clamp(26px, 4.6vw, 48px) clamp(24px, 5vw, 56px) clamp(26px, 4vw, 44px);
    text-align: center; animation: rise .6s cubic-bezier(.2,.7,.3,1) both;
  }
  .card::before { content: ''; position: absolute; top: -2px; left: 44px; width: 64px; height: 2px; background: var(--accent2); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }

  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .34em; color: var(--accent); text-transform: uppercase; margin-bottom: 18px; }
  .tag b { color: var(--accent2); font-weight: 400; animation: blink 1.5s steps(2, jump-none) infinite; }
  @keyframes blink { from { opacity: 1; } to { opacity: .35; } }

  /* a countdown nobody can read: the digits never settle */
  .eta { font-family: var(--mono); font-size: clamp(24px, 5vw, 34px); letter-spacing: .08em; color: #eafff6; margin-bottom: 4px; text-shadow: 0 0 18px rgba(61,255,176,0.4); }
  .eta span { color: var(--accent); }
  .now { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 18px; }
  .now b { color: var(--accent2); font-weight: 400; }

  h1 {
    font-family: var(--sans); font-weight: 700; line-height: 1.06; letter-spacing: .01em;
    font-size: clamp(30px, 6.2vw, 56px); color: #eafff6; margin-bottom: 18px;
    text-shadow: 0 0 30px rgba(61,255,176,0.2);
  }
  h1 .hl { color: var(--accent2); text-shadow: 0 0 30px rgba(255,77,109,0.35); }
  .lead { font-size: clamp(15px, 2.4vw, 18px); font-weight: 300; line-height: 1.6; color: var(--text); max-width: 30em; margin: 0 auto 28px; text-wrap: pretty; }
  .lead b { color: #fff; font-weight: 600; }

  .cta {
    display: inline-flex; align-items: baseline; gap: 12px; font: inherit; cursor: pointer;
    border: 1px solid var(--accent); background: rgba(61,255,176,0.05);
    padding: 16px 26px; position: relative; overflow: hidden;
    transition: background .25s, box-shadow .25s, transform .15s;
  }
  .cta::before { content: ''; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .3s ease; z-index: 0; }
  .cta:hover { box-shadow: 0 0 30px rgba(61,255,176,0.4); }
  .cta:hover::before { transform: scaleX(1); }
  .cta:active { transform: translateY(1px); }
  .cta:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .cta > * { position: relative; z-index: 1; transition: color .25s; }
  .cta-label { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-dim); }
  .cta-url { font-family: var(--mono); font-size: clamp(15px, 2.9vw, 22px); letter-spacing: .06em; color: #eafff6; font-weight: 700; text-transform: uppercase; }
  .cta:hover .cta-label { color: #0a4a32; }
  .cta:hover .cta-url   { color: #021a10; }

  .foot { margin-top: 26px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; line-height: 1.7; color: var(--text-dim); text-wrap: balance; }
  .foot a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted rgba(61,255,176,0.5); }
  .foot a:hover { border-bottom-style: solid; }

  @media (max-width: 560px) {
    .cta { flex-direction: column; align-items: center; gap: 4px; }
    .tag { letter-spacing: .22em; }
  }
  @media (prefers-reduced-motion: reduce) { .tag b { animation: none; } }
</style>
</head>
<body>

<canvas id="scope"></canvas>

<main class="card" id="card">
  <div class="tag">// SIM &middot; 016 &nbsp;&middot;&nbsp; <b>Unidentified</b></div>
  <div class="eta" aria-hidden="true"><span>T&minus;</span><b id="eta">00:00:00</b></div>
  <div class="now">Arrival: <b>unknown</b></div>
  <h1>Something is<br><span class="hl">inbound.</span></h1>
  <p class="lead">A second unannounced project is on approach. No name, no screenshots, no hints &mdash; just a contact on the scope, <b>a little closer with every sweep</b>.</p>
  <button class="cta" id="ping" type="button">
    <span class="cta-label">Scope</span>
    <span class="cta-url" id="answer" aria-live="polite">Ping it</span>
  </button>
  <div class="foot">Coming soon &middot; watch this space<br><a href="../index.html" id="home">&larr; back to the open projects</a></div>
</main>

<script>
'use strict';
/* A radar scope the size of the page. A beam sweeps round and repaints whatever
   it crosses; most of it is clutter, but one contact steps toward the middle
   every time the beam finds it -- until it slips under the card, and a new one
   appears at the edge. "Ping it" sends a ring out from the centre; the contact
   answers when the ring reaches it. */
(function () {
  const cvs = document.getElementById('scope');
  const ctx = cvs.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const MONO = "'Share Tech Mono', monospace";
  const TAU = Math.PI * 2, PERIOD = 5.2;                  // seconds per sweep
  const card = document.getElementById('card');
  let W = 0, H = 0, cx = 0, cy = 0, R = 0, STEP = 100;
  let clutter = [];
  const contact = { a: 0, r: 0, from: 0, to: 0, glow: 0, trail: [], lost: 0 };
  const pings = [];                          // {t0, hit}
  const norm = a => ((a % TAU) + TAU) % TAU;

  // how far from the centre a ray at angle `a` leaves a centred half-box
  const reach = (a, hw, hh) => Math.min(hw / Math.max(1e-6, Math.abs(Math.cos(a))), hh / Math.max(1e-6, Math.abs(Math.sin(a))));

  function spawn() {
    const hw = card.offsetWidth / 2, hh = card.offsetHeight / 2;
    // approach down a side gutter when there is one, otherwise from above / below
    const sideways = W / 2 - hw > 110;
    const base = (sideways ? 0 : Math.PI / 2) + (Math.random() < 0.5 ? 0 : Math.PI);
    contact.a = norm(base + (Math.random() - 0.5) * (sideways ? 1.0 : 0.7));
    contact.from = reach(contact.a, W / 2, H / 2) - 46;
    contact.to = Math.min(contact.from - 40, reach(contact.a, hw, hh) + 40);
    contact.r = contact.from; contact.glow = 0; contact.trail = []; contact.lost = 0;
  }

  function resize() {
    W = innerWidth; H = innerHeight;
    cvs.width = Math.floor(W * dpr); cvs.height = Math.floor(H * dpr);
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    cx = W / 2; cy = H / 2; R = Math.hypot(W, H) / 2 + 4;
    STEP = Math.max(64, Math.min(W, H) * 0.125);
    clutter = Array.from({ length: Math.round(8 + (W * H) / 160000) }, () => ({
      a: Math.random() * TAU, r: R * (0.22 + Math.random() * 0.74), glow: 0, size: 1.4 + Math.random() * 1.8
    }));
    spawn();
  }
  window.addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(spawn);   // card size settles with the fonts

  // did the beam cross angle `a` while moving from `a0` to `a1`?
  const crossed = (a, a0, a1) => norm(a - a0) <= norm(a1 - a0);

  let beam = -Math.PI / 2, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const prev = beam;
    beam = norm(beam + (TAU / PERIOD) * dt);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // graticule: range rings + spokes
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(61,255,176,0.085)';
    for (let r = STEP; r < R; r += STEP) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(61,255,176,0.05)';
    ctx.beginPath();
    for (let k = 0; k < 12; k++) { const a = (k * TAU) / 12; ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); }
    ctx.stroke();
    // bearing ring: the largest circle that fits the viewport
    const br = Math.min(W, H) / 2 - 18;
    ctx.strokeStyle = 'rgba(61,255,176,0.22)';
    ctx.beginPath();
    for (let d = 0; d < 360; d += 5) {
      const a = (d - 90) * Math.PI / 180, len = d % 30 === 0 ? 10 : 4;
      ctx.moveTo(cx + Math.cos(a) * br, cy + Math.sin(a) * br);
      ctx.lineTo(cx + Math.cos(a) * (br - len), cy + Math.sin(a) * (br - len));
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(61,255,176,0.30)'; ctx.font = '10px ' + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let d = 0; d < 360; d += 30) {
      const a = (d - 90) * Math.PI / 180;
      ctx.fillText(('00' + d).slice(-3), cx + Math.cos(a) * (br - 22), cy + Math.sin(a) * (br - 22));
    }

    // the beam and its afterglow
    const TAIL = 46, SEG = 0.03;
    for (let i = 0; i < TAIL; i++) {
      const f = 1 - i / TAIL;
      ctx.fillStyle = 'rgba(61,255,176,' + (0.15 * f * f).toFixed(4) + ')';
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, beam - (i + 1) * SEG, beam - i * SEG + 0.002);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(160,255,214,0.75)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(beam) * R, cy + Math.sin(beam) * R); ctx.stroke();

    // clutter
    ctx.fillStyle = '#3dffb0'; ctx.shadowColor = '#3dffb0';
    for (const b of clutter) {
      if (crossed(b.a, prev, beam)) b.glow = 1;
      b.glow *= Math.exp(-dt / 1.5);
      if (b.glow < 0.02) continue;
      ctx.globalAlpha = b.glow * 0.85; ctx.shadowBlur = 9 * b.glow;
      ctx.beginPath(); ctx.arc(cx + Math.cos(b.a) * b.r, cy + Math.sin(b.a) * b.r, b.size, 0, TAU); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    // pings from the button
    for (let i = pings.length - 1; i >= 0; i--) {
      const p = pings[i], age = (now - p.t0) / 1000, pr = age * R * 0.62;
      if (pr > R) { pings.splice(i, 1); continue; }
      if (!p.hit && pr >= contact.r) { p.hit = true; contact.glow = 1.8; pings.push({ t0: now, hit: true, x: Math.cos(contact.a) * contact.r, y: Math.sin(contact.a) * contact.r, echo: true }); }
      ctx.strokeStyle = p.echo ? 'rgba(255,77,109,' + Math.max(0, 0.8 - age * 1.6).toFixed(3) + ')'
                               : 'rgba(160,255,214,' + (0.6 * (1 - pr / R)).toFixed(3) + ')';
      ctx.lineWidth = p.echo ? 1.4 : 2;
      ctx.beginPath(); ctx.arc(cx + (p.x || 0), cy + (p.y || 0), p.echo ? age * 150 : pr, 0, TAU); ctx.stroke();
    }

    // the contact: one step closer each time the beam finds it
    if (crossed(contact.a, prev, beam)) {
      if (contact.lost) spawn();
      else {
        contact.trail.unshift(contact.r); contact.trail.length = Math.min(contact.trail.length, 5);
        contact.r -= (contact.from - contact.to) / 8;
        if (contact.r <= contact.to + 1) { contact.r = contact.to; contact.lost = 1; }
      }
      contact.glow = 1;
    }
    contact.glow *= Math.exp(-dt / 2.6);
    const ux = Math.cos(contact.a), uy = Math.sin(contact.a);
    const px = cx + ux * contact.r, py = cy + uy * contact.r, g = Math.min(1, contact.glow);
    ctx.fillStyle = ctx.strokeStyle = '#ff4d6d';
    contact.trail.forEach((r, i) => {                       // where it was on earlier sweeps
      ctx.globalAlpha = 0.34 * (1 - i / 5) * (0.35 + 0.65 * g);
      ctx.beginPath(); ctx.arc(cx + ux * r, cy + uy * r, 2, 0, TAU); ctx.fill();
    });
    ctx.globalAlpha = 0.30 + 0.70 * g; ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 16 * g;
    ctx.beginPath(); ctx.arc(px, py, 4, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(px, py, 10 + 8 * (1 - g), 0, TAU); ctx.stroke();
    // its tag, on whichever side has room
    const brg = Math.round(norm(contact.a + Math.PI / 2) * 180 / Math.PI) % 360;
    const lines = contact.lost ? ['CONTACT LOST', 'BRG ' + ('00' + brg).slice(-3) + '  RNG ---']
                               : ['UNIDENTIFIED', 'BRG ' + ('00' + brg).slice(-3) + '  RNG ' + ((contact.r / STEP) * 10).toFixed(1)];
    ctx.font = '11px ' + MONO; ctx.textBaseline = 'middle';
    const tw = Math.max(ctx.measureText(lines[0]).width, ctx.measureText(lines[1]).width);
    const right = px + 20 + tw < W - 8 && (ux >= 0 || px - 20 - tw < 8);
    ctx.textAlign = right ? 'left' : 'right';
    const lx = px + (right ? 20 : -20), ly = Math.max(16, Math.min(H - 30, py - 7));
    ctx.globalAlpha = 0.45 + 0.55 * g;
    ctx.fillText(lines[0], lx, ly);
    ctx.globalAlpha = 0.30 + 0.45 * g;
    ctx.fillText(lines[1], lx, ly + 15);
    ctx.globalAlpha = 1;

    raf = requestAnimationFrame(frame);
  }

  let raf = requestAnimationFrame(frame);
  window.addEventListener('pagehide', () => cancelAnimationFrame(raf));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else { last = performance.now(); raf = requestAnimationFrame(frame); }
  });

  /* -- the countdown that will not hold still -- */
  const eta = document.getElementById('eta');
  const two = n => ('0' + ((Math.random() * n) | 0)).slice(-2);
  setInterval(() => { if (!document.hidden) eta.textContent = two(100) + ':' + two(60) + ':' + two(60); }, 85);

  /* -- ping -- */
  const btn = document.getElementById('ping'), answer = document.getElementById('answer');
  const REPLY = ['No reply', 'Echo unreadable', 'It pinged back', 'Still closing'];
  let n = 0, t1 = 0, t2 = 0;
  btn.addEventListener('click', () => {
    pings.push({ t0: performance.now(), hit: false });
    answer.textContent = 'Pinging...';
    clearTimeout(t1); clearTimeout(t2);
    t1 = setTimeout(() => { answer.textContent = REPLY[n++ % REPLY.length]; }, 1500);
    t2 = setTimeout(() => { answer.textContent = 'Ping it'; }, 3600);
  });

  /* -- inside the site shell, "back" switches frames instead of loading the shell into this one -- */
  document.getElementById('home').addEventListener('click', e => {
    if (window.parent === window) return;
    e.preventDefault();
    window.parent.postMessage({ sq: 'show', page: 0 }, '*');
  });
})();
</script>
</body>
</html>
